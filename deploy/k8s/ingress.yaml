# CHANGEME: host — currently a staging subdomain distinct from the live
# feed-fiddler.cubanyetis.net (AWS) address, so testing doesn't collide with
# it; must match the --base-url domain in cronjob.yaml. Point DNS at the
# farfaraway cluster's traefik ingress once you're ready to test.
# ingressClassName is omitted to use the cluster's default (traefik, on farfaraway).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feed-fiddler-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - feed-fiddler-k8s.cubanyetis.net
      secretName: feed-fiddler-web-tls
  rules:
    - host: feed-fiddler-k8s.cubanyetis.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: feed-fiddler-web
                port:
                  number: 80
