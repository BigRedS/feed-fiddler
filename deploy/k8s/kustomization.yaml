apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: feed-fiddler

resources:
  - namespace.yaml
  - pvc.yaml
  - cronjob.yaml
  - nginx-deployment.yaml
  - nginx-service.yaml
  - ingress.yaml

# Content-hashed, so a feeds.k8s.yaml change produces a new ConfigMap and the
# CronJob picks it up next run — no manual restart needed.
configMapGenerator:
  - name: feed-fiddler-config
    files:
      - feeds.yaml=feeds.k8s.yaml

# Always :latest — the CronJob's imagePullPolicy: Always means each run
# re-pulls the freshest image pushed by CI (.github/workflows/build-image.yaml)
# or by deploy-k8s.sh.
images:
  - name: feed-fiddler
    newName: ghcr.io/bigreds/feed-fiddler
    newTag: latest
